# 构建站点、生成搜索索引并部署到 GitHub Pages。
# 推送到 main 分支时自动运行；也可以在仓库的 Actions 页面手动运行。

name: 构建并部署

# Hugo 版本取自 hugo.toml 的 [module.hugoVersion]，见「读取 Hugo 版本」一步
env:
  PAGEFIND_VERSION: 1.5.2
  NODE_VERSION: "24"
  TZ: Asia/Shanghai

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v7
        with:
          # 取完整历史，「最后修订」时间才准确
          fetch-depth: 0

      - name: 读取 Hugo 版本
        run: |
          v=$(sed -n "s/^[[:space:]]*min[[:space:]]*=[[:space:]]*['\"]\([0-9.]*\)['\"].*/\1/p" hugo.toml | head -n1)
          test -n "$v" || { echo "::error::hugo.toml 中没有找到 [module.hugoVersion] min"; exit 1; }
          echo "HUGO_VERSION=$v" >> "$GITHUB_ENV"

      - name: 配置 Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: 安装 Node.js（运行 Pagefind 所需）
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 安装 Hugo
        run: |
          mkdir -p "${HOME}/.local/hugo"
          curl -sfL --output-dir "${{ runner.temp }}" -O \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -C "${HOME}/.local/hugo" -xf "${{ runner.temp }}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HOME}/.local/hugo" >> "${GITHUB_PATH}"

      - name: 配置 Git
        run: git config --global core.quotepath false

      - name: 构建站点
        run: |
          hugo version
          hugo build \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/" \
            --cacheDir "${{ runner.temp }}/.cache/hugo"

      - name: 检查站内链接
        run: python3 .github/scripts/check-links.py public

      - name: 生成搜索索引
        run: npx --yes "pagefind@${PAGEFIND_VERSION}" --site public

      - name: 上传站点
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
