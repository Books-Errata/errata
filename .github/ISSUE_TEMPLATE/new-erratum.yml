name: 提交新勘误
description: 对照原文，提交中译本中与原文有出入之处，或改写、删节的对照。
title: "[新勘误] "
labels: ["新勘误"]
body:
  - type: markdown
    attributes:
      value: |
        感谢参与。提交之前，请先读一遍[收录原则与写作要求](https://errata.hone.ink/contribute/)。

        标题请写成「[新勘误] 原文词语或位置（《书名》）」，例如「[新勘误] les Trente Glorieuses（《某书》）」。不确定怎么写也没关系，维护者会调整。

  - type: input
    id: book
    attributes:
      label: 中译本书名
    validations:
      required: true

  - type: input
    id: translator
    attributes:
      label: 译者
    validations:
      required: true

  - type: input
    id: publisher
    attributes:
      label: 出版社
    validations:
      required: true

  - type: input
    id: edition
    attributes:
      label: 版次与印次
      description: 见版权页。不同印次的文字可能不同，所以印次不能省略。
      placeholder: 2020年1月第1版，2021年3月第3次印刷
    validations:
      required: true

  - type: input
    id: original
    attributes:
      label: 原书名与所据版本
      description: 你对照的原书是哪个出版社、哪一年的版本。
      placeholder: The Origins of Totalitarianism, Penguin Classics, 2017
    validations:
      required: true

  - type: input
    id: page_cn
    attributes:
      label: 中译本页码
      description: 看电子书没有页码时可以不填，在下面的「位置」中写章节。
    validations:
      required: false

  - type: input
    id: page_orig
    attributes:
      label: 原书页码
      description: 没有页码时可以不填。
    validations:
      required: false

  - type: input
    id: location
    attributes:
      label: 位置
      description: 没有页码时，写章节等位置，便于读者找到原处。有页码也可以一起写。
      placeholder: 第七章第二节
    validations:
      required: false

  - type: textarea
    id: source_text
    attributes:
      label: 原文
      description: 以说明问题所需为限，一般不超过一两句。删节可以概述内容，只引说明位置所需的一两句。
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: 现译
      description: 中译本对应位置的文字，一般不超过一两句。如果译本此处没有对应文字，请写明。
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 说明
      description: |
        - 程度为「错误」「不够精确」：说明译文与原文的出入。
        - 程度为「可商榷」：说明为何另有考虑，不下定论。
        - 改写、删节：并列说明原文说了什么、译文说了什么，不使用「问题」「错误」等词，也不描述立场或动机。

        只针对文本，不评价译者，不推测成因。
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: 建议
      description: 建议的译法。只改需要改的部分；把握不足时如实说明。改写、删节不填。
    validations:
      required: false

  - type: textarea
    id: basis
    attributes:
      label: 依据
      description: 可核对的依据，例如词典及义项、官方名称、通行译名的出处、已出版的中译本、史实及其出处、原书上下文。改写、删节可写所核对的原书版本。
    validations:
      required: true

  - type: dropdown
    id: types
    attributes:
      label: 类型
      description: |
        只选一个。各类的说明和判断顺序见 https://errata.hone.ink/types/ 。不确定就选「不确定」，维护者会再确认。

        - 译名：人名、地名、机构名、书名、历史名词、术语没有用既有的中文说法，或认错了所指（含回译）
        - 词义：词或短语在上下文中的意义取错或取偏
        - 句法：结构、修饰关系、指代、否定或比较或条件的范围与原文不符
        - 修辞与语气：比喻、习语、典故按字面译出，或反讽、褒贬、语气没有传达或被改变
        - 漏译：原文某句在译文中有对应，但句中的词、短语或分句没有对应
        - 增译：译文多出原文没有的内容，又不是中文通顺所需
        - 改写：两边都有文字，但内容不同，且无法由对原文的任何理解得出（只做对照）
        - 删节：原文一整句或更多在译文中没有对应（只做对照）
      multiple: false
      options:
        - 译名
        - 词义
        - 句法
        - 修辞与语气
        - 漏译
        - 增译
        - 改写
        - 删节
        - 不确定
    validations:
      required: true

  - type: dropdown
    id: degree
    attributes:
      label: 程度
      description: |
        - 错误：译文所述与原文不符，可以核实。
        - 不够精确：基本意思不错，但偏离了原文的重点、语气或色彩。
        - 可商榷：现译可以成立，只是另有值得考虑的译法；或证据不足以断定。

        改写、删节不分程度，选「不适用」。
      multiple: false
      options:
        - 错误
        - 不够精确
        - 可商榷
        - 不适用（改写、删节）
        - 不确定
    validations:
      required: true

  - type: input
    id: terms
    attributes:
      label: 涉及的术语（可选）
      description: 如果这个问题涉及某个在多本书中都可能出现的术语，写在这里，例如 totalitarianism。
    validations:
      required: false

  - type: input
    id: credit
    attributes:
      label: 署名（可选）
      description: 希望在贡献者名单中显示的名字。条目本身不署名。不填则不列名。
    validations:
      required: false

  - type: checkboxes
    id: agreement
    attributes:
      label: 确认
      options:
        - label: 我同意以 CC BY-SA 4.0 授权本站使用我撰写的说明文字。
          required: true
        - label: 我已阅读收录原则与写作要求，并按要求撰写。
          required: true
